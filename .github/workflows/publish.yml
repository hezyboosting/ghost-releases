# Publie une version de Ghost : la branche upload/vX.Y.Z contient l'installateur découpé en morceaux (< 100 Mo)
# et notes.md. Ce workflow recolle l'installateur, vérifie sa somme SHA-256, crée la release, puis supprime la branche.
name: Publier une version
on:
  push:
    branches: ["upload/**"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recoller et vérifier l'installateur
        run: |
          set -e
          VER="${GITHUB_REF_NAME#upload/}"
          cat parts/Ghost-Setup.exe.part* > "Ghost-Setup-${VER#v}.exe"
          echo "$(cat sha256.txt)  Ghost-Setup-${VER#v}.exe" | sha256sum -c -
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VER" "Ghost-Setup-${VER#v}.exe" --title "Ghost ${VER#v}" --notes-file notes.md --target main
      - name: Supprimer la branche d'envoi
        run: git push origin --delete "$GITHUB_REF_NAME"
