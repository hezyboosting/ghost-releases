# Publie une version de Ghost depuis la branche upload/vX.Y.Z, puis supprime la branche.
#  - installateur complet : parts/Ghost-Setup.exe.part* (morceaux < 100 Mo) + sha256.txt
#  - petite mise à jour : Ghost-Patch-X.Y.Z.ghp ; l'installateur de la version précédente est remis dans la release
#    pour les nouveaux utilisateurs (Ghost se met ensuite à jour tout seul)
name: Publier une version
on:
  push:
    branches: ["upload/**"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="${GITHUB_REF_NAME#upload/}"; echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir out
          if ls parts/Ghost-Setup.exe.part* >/dev/null 2>&1; then
            cat parts/Ghost-Setup.exe.part* > "out/Ghost-Setup-${VER#v}.exe"
            echo "$(cat sha256.txt)  out/Ghost-Setup-${VER#v}.exe" | sha256sum -c -
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "Ghost-Setup-*.exe" --dir out
          fi
          if ls Ghost-Patch-*.ghp >/dev/null 2>&1; then cp Ghost-Patch-*.ghp out/; fi
          ls -la out
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VER" out/* --title "Ghost ${VER#v}" --notes-file notes.md --target main
      - name: Supprimer la branche d'envoi
        run: git push origin --delete "$GITHUB_REF_NAME"
